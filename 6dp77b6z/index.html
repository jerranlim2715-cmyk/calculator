
      <!DOCTYPE html>
      <html>
        <head>
          
          
          
          <link rel="stylesheet" type="text/css" href="style.css" />
          
          
          
        </head>
        <body>
          
<div id="calc_area">
    <div id="ans">Answer</div>
    <button class="number r1 c1" id="1" onclick="digitadd(1)">1</button>
    <button class="number r1 c2" id="2" onclick="digitadd(2)">2</button>
    <button class="number r1 c3" id="3" onclick="digitadd(3)">3</button>
    <button class="number r2 c1" id="4" onclick="digitadd(4)">4</button>
    <button class="number r2 c2" id="5" onclick="digitadd(5)">5</button>
    <button class="number r2 c3" id="6" onclick="digitadd(6)">6</button>
    <button class="number r3 c1" id="7" onclick="digitadd(7)">7</button>
    <button class="number r3 c2" id="8" onclick="digitadd(8)">8</button>
    <button class="number r3 c3" id="9" onclick="digitadd(9)">9</button>
    <button class="number r4 c2" id="0" onclick="digitadd(0)">0</button>
    <button class="number r4 c3" id="." onclick="decimaladd()">.</button>
    <button class="function r1 c4" id="+" onclick="functrans('plus')">+</button>
    <button class="function r2 c4" id="-" onclick="functrans('minus')">-</button>
    <button class="function r3 c4" id="/" onclick="functrans('divide')">/</button>
    <button class="function r4 c4" id="*" onclick="functrans('multi')">X</button>
    <button class="function r4 c1" id="erase" onclick="erase()">Er</button>
    <button class="function r5 c1" id="cancel" onclick="cancel()">Cc</button>
    <button class="function r5 c4" id="input" onclick="enter()">→</button>

</div>
    
    

          
          <script type="text/javascript" src="script.js"></script>
          
        </body>
      </html>
